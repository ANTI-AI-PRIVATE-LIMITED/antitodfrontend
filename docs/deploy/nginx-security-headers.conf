# BUG-034: security headers for antitode.antiai.ltd (and api.antitode.antiai.ltd).
# The production nginx config is not in this repo. Copy this into the server's nginx config
# (inside the `server { listen 443 ssl; ... }` block, or the `http {}` block), then run:
#   sudo nginx -t && sudo systemctl reload nginx
# Check with: curl -sI https://antitode.antiai.ltd | grep -iE "strict|frame|content-type-options|referrer|server"

# Hide the nginx version ("Server: nginx/1.24.0" -> "Server: nginx")
server_tokens off;

# Force HTTPS for 1 year (only enable once every subdomain works over HTTPS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Stop other sites from framing the app (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Stop MIME sniffing, limit referrer data, turn off unused browser features
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Note: nginx drops these if a `location` block has its own `add_header`.
# If so, repeat them inside that location block too.
